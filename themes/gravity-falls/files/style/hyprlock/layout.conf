background {
    monitor =
    path = @STYLE@/wallpaper.png
    blur_passes = 0
    brightness = 0.55
}
label {
    monitor =
    text = $TIME
    color = rgb(f4e7d0)
    font_family = monospace
    font_size = 42
    position = 48, -44
    halign = left
    valign = top
}
label {
    monitor =
    text = cmd[update:60000] date '+%d %B %Y'
    color = rgb(b39e8c)
    font_family = monospace
    font_size = 10
    position = 50, -108
    halign = left
    valign = top
}
# Caesar +3. Shift every letter three back to read it.
label {
    monitor =
    text = WKH ZRRGV UHPHPEHU ZKDW WKH WRZQ IRUJHWV.
    color = rgb(f0a84a)
    font_family = monospace
    font_size = 11
    position = 0, 168
    halign = center
    valign = bottom
}
input-field {
    monitor =
    size = 350, 52
    position = 0, 100
    halign = center
    valign = bottom
    outline_thickness = 1
    rounding = 6
    outer_color = rgb(f0a84a)
    inner_color = rgba(140f12f2)
    font_color = rgb(f4e7d0)
    font_family = monospace
    dots_center = true
    fade_on_empty = false
    placeholder_text = <span foreground="#b39e8c">Password</span>
    check_color = rgb(f0a84a)
    check_text = Checking…
    fail_color = rgb(e0574a)
    fail_text = Try again
}
