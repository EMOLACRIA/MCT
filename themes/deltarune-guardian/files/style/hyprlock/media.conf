# Managed media component. Controls affect only the selected MPRIS player.
shape {
    monitor =
    size = 470, 206
    position = 48, 80
    halign = left
    valign = bottom
    color = rgba(0b1120ed)
    border_color = rgb(7c83ac)
    border_size = 1
    rounding = 6
    zindex = 0
}
image {
    monitor =
    path = @STYLE@/hyprlock/cover.png
    reload_time = 2
    reload_cmd = python3 "@STYLE@/scripts/lock-media.py" cover
    size = 112
    position = 70, 151
    halign = left
    valign = bottom
    rounding = 6
    border_size = 1
    border_color = rgb(7c83ac)
    zindex = 1
}
label {
    monitor =
    text = cmd[update:1000] python3 "@STYLE@/scripts/lock-media.py" state
    color = rgb(a7e5f7)
    font_family = monospace
    font_size = 9
    position = 205, 244
    halign = left
    valign = bottom
    zindex = 2
}
label {
    monitor =
    text = cmd[update:1000] python3 "@STYLE@/scripts/lock-media.py" title
    color = rgb(eae5ff)
    font_family = monospace
    font_size = 16
    position = 205, 204
    halign = left
    valign = bottom
    zindex = 2
}
label {
    monitor =
    text = cmd[update:1000] python3 "@STYLE@/scripts/lock-media.py" artist
    color = rgb(aaaed0)
    font_family = monospace
    font_size = 10
    position = 205, 177
    halign = left
    valign = bottom
    zindex = 2
}
image {
    monitor =
    path = @STYLE@/hyprlock/previous.png
    size = 36
    position = 205, 110
    halign = left
    valign = bottom
    border_size = 0
    rounding = 6
    onclick = python3 "@STYLE@/scripts/lock-media.py" previous
    zindex = 2
}
image {
    monitor =
    path = @STYLE@/hyprlock/play.png
    size = 36
    position = 265, 110
    halign = left
    valign = bottom
    border_size = 0
    rounding = 6
    onclick = python3 "@STYLE@/scripts/lock-media.py" toggle
    zindex = 2
    reload_time = 1
    reload_cmd = python3 "@STYLE@/scripts/lock-media.py" button
}
image {
    monitor =
    path = @STYLE@/hyprlock/next.png
    size = 36
    position = 325, 110
    halign = left
    valign = bottom
    border_size = 0
    rounding = 6
    onclick = python3 "@STYLE@/scripts/lock-media.py" next
    zindex = 2
}
