background {
    monitor =
    path = @STYLE@/wallpaper.png
    blur_passes = 0
    brightness = 0.85
}
shape {
    monitor =
    size = 400, 170
    position = 47, -37
    halign = left
    valign = top
    color = rgb(2fb3e8)
    rounding = 0
    border_size = 0
    zindex = 0
}
shape {
    monitor =
    size = 400, 170
    position = 40, -30
    halign = left
    valign = top
    color = rgba(ece8def5)
    rounding = 0
    border_size = 0
    zindex = 1
}
label {
    monitor =
    text = $TIME
    color = rgb(111111)
    font_family = sans-serif
    font_size = 42
    position = 60, -44
    halign = left
    valign = top
    zindex = 2
}
label {
    monitor =
    text = cmd[update:60000] date '+%d %B %Y'
    color = rgb(5c5850)
    font_family = sans-serif
    font_size = 10
    position = 62, -108
    halign = left
    valign = top
    zindex = 2
}
label {
    monitor =
    text = BREAK THE CANON.
    color = rgb(e8285a)
    font_family = sans-serif
    font_size = 14
    position = 62, -138
    halign = left
    valign = top
    zindex = 2
}
input-field {
    monitor =
    size = 350, 52
    position = 0, 100
    halign = center
    valign = bottom
    outline_thickness = 2
    rounding = 0
    outer_color = rgb(e8285a)
    inner_color = rgba(ece8def5)
    font_color = rgb(111111)
    font_family = monospace
    dots_center = true
    fade_on_empty = false
    placeholder_text = <span foreground="#5c5850">Password</span>
    check_color = rgb(2fb3e8)
    check_text = Checking…
    fail_color = rgb(c2410c)
    fail_text = Try again
}
