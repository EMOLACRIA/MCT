background {
    monitor =
    path = @STYLE@/wallpaper.png
    blur_passes = 0
    brightness = 0.85
}
shape {
    monitor =
    size = 420, 170
    position = 40, -30
    halign = left
    valign = top
    color = rgba(0b1d28e6)
    rounding = 4
    border_size = 2
    border_color = rgb(b9cdd2)
    zindex = 1
}
shape {
    monitor =
    size = 380, 2
    position = 60, -170
    halign = left
    valign = top
    color = rgb(7fe3ef)
    rounding = 0
    border_size = 0
    zindex = 2
}
label {
    monitor =
    text = $TIME
    color = rgb(eef8ff)
    font_family = serif
    font_size = 42
    position = 62, -44
    halign = left
    valign = top
    zindex = 3
}
label {
    monitor =
    text = cmd[update:60000] date '+%d %B %Y'
    color = rgb(a3c2cf)
    font_family = sans-serif
    font_size = 10
    position = 64, -108
    halign = left
    valign = top
    zindex = 3
}
label {
    monitor =
    text = CHART YOUR OWN COURSE.
    color = rgb(7fe3ef)
    font_family = serif
    font_size = 14
    position = 64, -134
    halign = left
    valign = top
    zindex = 3
}
input-field {
    monitor =
    size = 350, 52
    position = 0, 100
    halign = center
    valign = bottom
    outline_thickness = 2
    rounding = 4
    outer_color = rgb(b9cdd2)
    inner_color = rgba(0b1d28e6)
    font_color = rgb(eef8ff)
    font_family = monospace
    dots_center = true
    fade_on_empty = false
    placeholder_text = <span foreground="#a3c2cf">Password</span>
    check_color = rgb(7fe3ef)
    check_text = Checking…
    fail_color = rgb(ff8a7a)
    fail_text = Try again
}
