background {
    monitor =
    path = @STYLE@/wallpaper.png
    blur_passes = 0
    brightness = 0.65
}
label {
    monitor =
    text = $TIME
    color = rgb(e9ddff)
    font_family = monospace
    font_size = 42
    position = 48, -44
    halign = left
    valign = top
}
label {
    monitor =
    text = cmd[update:60000] date '+%d %B %Y'
    color = rgb(aaa1c4)
    font_family = monospace
    font_size = 10
    position = 50, -108
    halign = left
    valign = top
}
input-field {
    monitor =
    size = 350, 52
    position = 0, 100
    halign = center
    valign = bottom
    outline_thickness = 1
    rounding = 0
    outer_color = rgb(f32baf)
    inner_color = rgba(060613f2)
    font_color = rgb(e9ddff)
    font_family = monospace
    dots_center = true
    fade_on_empty = false
    placeholder_text = <span foreground="#aaa1c4">Password</span>
    check_color = rgb(f32baf)
    check_text = Checking…
    fail_color = rgb(ff88ad)
    fail_text = Try again
}
