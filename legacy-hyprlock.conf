general {
    hide_cursor = false
    ignore_empty_input = true
}
background {
    monitor =
    path = @STYLE@/wallpaper.png
    blur_passes = 0
    brightness = 0.65
}
label {
    monitor =
    text = $TIME
    color = rgb(d8d3c5)
    font_family = serif
    font_size = 42
    position = -48, -44
    halign = right
    valign = top
}
label {
    monitor =
    text = cmd[update:60000] date '+%d %B %Y'
    color = rgb(aaa89b)
    font_family = sans-serif
    font_size = 10
    position = -50, -108
    halign = right
    valign = top
}
input-field {
    monitor =
    size = 310, 48
    position = -48, 100
    halign = right
    valign = bottom
    outline_thickness = 1
    rounding = 0
    outer_color = rgb(9b8967)
    inner_color = rgba(191a18f2)
    font_color = rgb(d8d3c5)
    font_family = sans-serif
    dots_center = true
    fade_on_empty = false
    placeholder_text = <span foreground="#aaa89b">Password</span>
    check_color = rgb(9b8967)
    check_text = Checking…
    fail_color = rgb(b47866)
    fail_text = Try again
}

# desktop-style media begin
source = @STYLE@/hyprlock/media.conf
# desktop-style media end
